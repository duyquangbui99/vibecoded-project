<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <title>WhisperNotes – Capture Your Thoughts</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
        :root {
            --bg: #f5f7ff;
            --card-bg: #ffffff;
            --text: #0f1222;
            --muted: #6b7280;
            --indigo: #5b6cff;
            --purple: #7a5cff;
            --pink: #ff5bd5;
            --radius: 18px;
            --shadow: 0 18px 45px rgba(15, 23, 42, 0.12);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Inter", sans-serif;
            background: radial-gradient(1200px 400px at 80% -20%, rgba(90, 80, 255, 0.18), transparent 60%), var(--bg);
            color: var(--text);
            min-height: 100vh;
        }

        .container {
            width: min(960px, 94%);
            margin: 0 auto;
            padding: 2.5rem 0 3rem;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .brand {
            display: inline-flex;
            align-items: center;
            gap: .6rem;
            font-weight: 800;
            letter-spacing: -.01em;
        }

        .brand-icon {
            width: 32px;
            height: 32px;
            border-radius: 999px;
            display: grid;
            place-items: center;
            background: linear-gradient(135deg, var(--indigo), var(--purple));
            color: #fff;
            font-size: 18px;
        }

        .brand span:last-child {
            font-size: 1.1rem;
        }

        .back-link {
            font-size: .9rem;
            color: var(--muted);
            text-decoration: none;
        }

        h1 {
            margin: 0 0 .25rem;
            font-size: clamp(1.6rem, 2.4vw + .9rem, 2.2rem);
            letter-spacing: -.02em;
        }

        .subtitle {
            margin: 0 0 1.5rem;
            color: var(--muted);
        }

        .layout {
            display: grid;
            grid-template-columns: minmax(0, 3fr) minmax(0, 2.5fr);
            gap: 1.5rem;
        }

        @media (max-width: 800px) {
            .layout {
                grid-template-columns: 1fr;
            }
        }

        .panel {
            background: var(--card-bg);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 1.2rem 1.4rem 1.5rem;
        }

        .mic-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 1.2rem;
        }

        .mic-button {
            width: 90px;
            height: 90px;
            border-radius: 999px;
            border: none;
            outline: none;
            display: grid;
            place-items: center;
            background: radial-gradient(circle at 30% 20%, #ffffff, #edf0ff);
            box-shadow: 0 18px 40px rgba(79, 124, 255, 0.5);
            cursor: pointer;
            transition: transform .1s ease, box-shadow .1s ease, background .2s ease;
            position: relative;
        }

        .mic-button svg {
            width: 34px;
            height: 34px;
            fill: url(#mic-grad);
        }

        .mic-button::after {
            content: "";
            position: absolute;
            inset: -10px;
            border-radius: inherit;
            border: 2px solid transparent;
            transition: border-color .2s ease;
        }

        .mic-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 22px 50px rgba(79, 124, 255, 0.65);
        }

        .mic-button.recording {
            background: radial-gradient(circle at 30% 20%, #ffe9f8, #ff79d6);
        }

        .mic-button.recording::after {
            border-color: rgba(255, 255, 255, 0.7);
            animation: pulse 1.1s infinite;
        }

        @keyframes pulse {
            0% {
                transform: scale(1);
                opacity: 1;
            }

            100% {
                transform: scale(1.12);
                opacity: 0;
            }
        }

        .status {
            font-size: .95rem;
            color: var(--muted);
        }

        .status strong {
            color: var(--indigo);
        }

        textarea {
            width: 100%;
            min-height: 170px;
            resize: vertical;
            margin-top: .6rem;
            padding: .7rem .75rem;
            border-radius: 12px;
            border: 1px solid #e5e7f0;
            font: inherit;
            line-height: 1.45;
            outline: none;
        }

        textarea:focus {
            border-color: var(--indigo);
            box-shadow: 0 0 0 1px rgba(91, 108, 255, .4);
        }

        .actions {
            margin-top: .7rem;
            display: flex;
            justify-content: flex-end;
            gap: .6rem;
            flex-wrap: wrap;
        }

        .btn {
            border-radius: 999px;
            border: 1px solid transparent;
            padding: .55rem 1.05rem;
            font-size: .9rem;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
            display: inline-flex;
            align-items: center;
            gap: .45rem;
            transition: background .15s ease, border-color .15s ease, transform .05s ease;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--indigo), var(--purple));
            color: #fff;
            border-color: transparent;
            box-shadow: 0 10px 30px rgba(91, 108, 255, .55);
        }

        .btn-primary:hover {
            transform: translateY(-1px);
        }

        .btn-ghost {
            background: #f3f4ff;
            color: var(--indigo);
            border-color: rgba(91, 108, 255, .1);
        }

        .note-list-title {
            font-size: .95rem;
            font-weight: 600;
            margin-bottom: .75rem;
        }

        .note-list {
            display: flex;
            flex-direction: column;
            gap: .6rem;
            max-height: 420px;
            overflow-y: auto;
            padding-right: .2rem;
        }

        .note-card {
            border-radius: 14px;
            border: 1px solid #e4e7f5;
            background: #ffffff;
            padding: .65rem .8rem .7rem;
            font-size: .9rem;
        }

        .note-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: .5rem;
            margin-bottom: .4rem;
            color: var(--muted);
            font-size: .78rem;
        }

        .tag {
            padding: .15rem .55rem;
            border-radius: 999px;
            background: #eff0ff;
            color: #5559d6;
            font-weight: 500;
        }

        .note-text {
            color: #111827;
            display: -webkit-box;
            -webkit-line-clamp: 4;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .empty-state {
            text-align: center;
            font-size: .9rem;
            color: var(--muted);
            margin-top: 1.6rem;
        }

        small.error {
            display: block;
            margin-top: .4rem;
            color: #dc2626;
            font-size: .8rem;
        }
    </style>
</head>

<body>
    <div class="container">
        <header>
            <div class="brand">
                <div class="brand-icon">🎙️</div>
                <span>WhisperNotes</span>
            </div>
            <a href="index.html" class="back-link">← Back to landing</a>
        </header>

        <main>
            <h1>Capture your thoughts with your voice</h1>
            <p class="subtitle">
                Tap the microphone, start speaking, and WhisperNotes will turn your words into text you can edit and
                save.
            </p>

            <section class="layout">
                <!-- LEFT: recording & transcript -->
                <div class="panel">
                    <div class="mic-area">
                        <!-- gradient for mic icon -->
                        <svg width="0" height="0">
                            <defs>
                                <linearGradient id="mic-grad" x1="0%" y1="0%" x2="100%" y2="100%">
                                    <stop offset="0%" stop-color="#5b6cff" />
                                    <stop offset="50%" stop-color="#7a5cff" />
                                    <stop offset="100%" stop-color="#ff5bd5" />
                                </linearGradient>
                            </defs>
                        </svg>

                        <button id="micBtn" class="mic-button" type="button">
                            <svg viewBox="0 0 24 24" aria-hidden="true">
                                <path
                                    d="M12 14a4 4 0 0 0 4-4V7a4 4 0 1 0-8 0v3a4 4 0 0 0 4 4Zm7-4a1 1 0 1 0-2 0 5 5 0 0 1-10 0 1 1 0 1 0-2 0 7 7 0 0 0 6 6.93V20H8a1 1 0 1 0 0 2h8a1 1 0 1 0 0-2h-3v-3.07A7 7 0 0 0 19 10Z" />
                            </svg>
                        </button>

                        <div id="status" class="status">
                            <strong>Ready.</strong> Click the mic to start recording.
                        </div>
                    </div>

                    <label for="transcript"><strong>Transcript</strong></label>
                    <textarea id="transcript" placeholder="Your words will appear here..."></textarea>
                    <small id="errorMsg" class="error" style="display:none;"></small>

                    <div class="actions">
                        <button id="clearBtn" class="btn btn-ghost" type="button">Clear</button>
                        <button id="saveBtn" class="btn btn-primary" type="button">Save Note</button>
                    </div>
                </div>

                <!-- RIGHT: saved notes -->
                <aside class="panel">
                    <div class="note-list-title">Saved notes</div>
                    <div id="notes" class="note-list"></div>
                    <div id="emptyState" class="empty-state">No notes yet. Record something and hit “Save note”.</div>
                </aside>
            </section>
        </main>
    </div>

    <script>
        // --- Speech recognition setup (Web Speech API) ---
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        const micBtn = document.getElementById("micBtn");
        const statusEl = document.getElementById("status");
        const textArea = document.getElementById("transcript");
        const errorMsg = document.getElementById("errorMsg");
        const saveBtn = document.getElementById("saveBtn");
        const clearBtn = document.getElementById("clearBtn");
        const notesEl = document.getElementById("notes");
        const emptyState = document.getElementById("emptyState");

        let recognition = null;
        let listening = false;

        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.lang = "en-US";
            recognition.interimResults = true;
            recognition.continuous = true;

            recognition.onstart = () => {
                listening = true;
                micBtn.classList.add("recording");
                statusEl.innerHTML = "<strong>Listening…</strong> Speak naturally, click again to stop.";
                errorMsg.style.display = "none";
            };

            recognition.onresult = (event) => {
                let text = "";
                for (let i = 0; i < event.results.length; i++) {
                    text += event.results[i][0].transcript + " ";
                }
                textArea.value = text.trim();
            };

            recognition.onerror = (event) => {
                errorMsg.style.display = "block";
                errorMsg.textContent = "Error: " + event.error;
                stopListening();
            };

            recognition.onend = () => {
                if (listening) {
                    // Auto–restart if it ended unexpectedly
                    recognition.start();
                    return;
                }
                micBtn.classList.remove("recording");
                statusEl.innerHTML = "<strong>Paused.</strong> Click the mic to resume recording.";
            };
        } else {
            statusEl.innerHTML = "<strong>Browser not supported.</strong> Try Chrome on desktop or Android.";
            micBtn.disabled = true;
        }

        function startListening() {
            if (!recognition) return;
            listening = true;
            recognition.start();
        }

        function stopListening() {
            if (!recognition) return;
            listening = false;
            recognition.stop();
            micBtn.classList.remove("recording");
        }

        micBtn.addEventListener("click", () => {
            if (!recognition) return;
            if (listening) {
                stopListening();
            } else {
                startListening();
            }
        });

        clearBtn.addEventListener("click", () => {
            textArea.value = "";
            errorMsg.style.display = "none";
        });

        // --- Simple in-page "DB" of notes ---
        const notes = [];

        function renderNotes() {
            notesEl.innerHTML = "";
            if (notes.length === 0) {
                emptyState.style.display = "block";
                return;
            }
            emptyState.style.display = "none";

            notes
                .slice()
                .reverse()
                .forEach((note) => {
                    const card = document.createElement("div");
                    card.className = "note-card";

                    const meta = document.createElement("div");
                    meta.className = "note-meta";
                    const time = document.createElement("span");
                    time.textContent = new Date(note.createdAt).toLocaleString();
                    const tag = document.createElement("span");
                    tag.className = "tag";
                    tag.textContent = "Voice note";
                    meta.appendChild(time);
                    meta.appendChild(tag);

                    const text = document.createElement("div");
                    text.className = "note-text";
                    text.textContent = note.text;

                    card.appendChild(meta);
                    card.appendChild(text);
                    notesEl.appendChild(card);
                });
        }

        saveBtn.addEventListener("click", () => {
            const text = textArea.value.trim();
            if (!text) {
                errorMsg.style.display = "block";
                errorMsg.textContent = "There is nothing to save yet. Record or type a note first.";
                return;
            }
            notes.push({ text, createdAt: Date.now() });
            textArea.value = "";
            errorMsg.style.display = "none";
            renderNotes();
        });

        // initial render
        renderNotes();
    </script>
</body>

</html>
